echo 'cookiecutter-aws-lbd-demo-dev-infra: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=cookiecutter-aws-lbd-demo-dev-infra&filteringStatus=active&viewNested=true'
echo 'cookiecutter-aws-lbd-demo-dev-lbd: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/stackinfo?filteringText=cookiecutter-aws-lbd-demo-dev-lbd&filteringStatus=active&viewNested=true'
echo '--- Run command ---'
echo 'cdk synth'
cdk synth
"""

