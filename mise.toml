[tasks."cdk-gc-dev"]
description = "🧹 List unused CDK assets in the bootstrap bucket of dev (print only)"
dir = "cdk"
env = { ENV_NAME = "dev" }
depends = ["inst", "lambda-source-build"]
run = """
echo 'cdk gc --unstable=gc --action=print --profile {{env.AWS_PROFILE_FOR_DEV}}'
cdk gc --unstable=gc --action=print --profile {{env.AWS_PROFILE_FOR_DEV}}
"""

